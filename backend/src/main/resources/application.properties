# Application Configuration
spring.application.name=medichannel-backend
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/medichannel_db
spring.datasource.username=medichannel_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MediChannel Security Configuration
medichannel.security.aes-key=${MEDICHANNEL_AES_KEY}
medichannel.security.hmac-key=${MEDICHANNEL_HMAC_KEY}
medichannel.security.jwt-key=${MEDICHANNEL_JWT_KEY}
medichannel.security.jwt-issuer=medichannel
medichannel.security.jwt-ttl-seconds=900

# Error Handling Configuration
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never